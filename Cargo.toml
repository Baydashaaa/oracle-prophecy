[package]
name = "oracle-prophecy"
version = "0.1.0"
authors = ["Terra Oracle Classic"]
edition = "2021"
license = "Apache-2.0"
description = "Prediction markets for Terra Oracle Classic"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Сборка как библиотеки для интеграционных тестов: точки входа выключаются.
library = []

[dependencies]
# Версии выровнены с oracle-pool: две разные минорные cosmwasm-std в одном
# дереве уже однажды ломали проверки типов на живом коде.
cosmwasm-schema = "1.5.0"
cosmwasm-std = { version = "1.5.0", features = ["stargate"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
schemars = "0.8.16"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cw-multi-test = "0.20.0"
# anyhow приходит транзитивно с cw-multi-test, но тесты используют его
# напрямую для приведения ошибок - объявляем явно.
anyhow = "1.0"

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
